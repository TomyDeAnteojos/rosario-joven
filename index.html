<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosario Joven — Interactivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent: #f59e0b;
        }

        body {
            background: radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.1) 0%, transparent 45%),
                        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 45%),
                        #060913;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animación realista del pulgar pasando la cuenta */
        #thumbGroup {
            transform-origin: 205px 255px;
            transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .thumb-push-down {
            transform: rotate(14deg) translate(-8px, 18px) !important;
        }
        .thumb-push-up {
            transform: rotate(-10deg) translate(4px, -10px) !important;
        }

        /* Transición suave del texto de la oración */
        .prayer-fade {
            animation: prayerAppear 0.25s ease-out;
        }
        @keyframes prayerAppear {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar discreto por si el Ángelus o Credo requiere desplazamiento en pantallas pequeñas */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 9999px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between">

    <!-- BARRA SUPERIOR MINIMALISTA -->
    <header class="w-full px-4 sm:px-6 py-2.5 border-b border-white/10 bg-slate-950/60 backdrop-blur-md flex items-center justify-between shrink-0 z-30">
        <button onclick="showHomeScreen()" class="flex items-center gap-2.5 group focus:outline-none">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-slate-950 shadow-md shadow-amber-500/20">
                <i class="ph-fill ph-cross text-lg"></i>
            </div>
            <span class="font-display font-bold text-base sm:text-lg tracking-tight text-white">Rosario Joven</span>
        </button>

        <div class="flex items-center gap-2">
            <!-- Botón de Música de Ambiente -->
            <button id="ambientBtn" onclick="toggleAmbientSound()" class="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center gap-2 text-xs font-semibold text-slate-200 transition-all">
                <i id="ambientIcon" class="ph ph-waveform text-base text-amber-400"></i>
                <span id="ambientLabel">Música Ambiente: Off</span>
            </button>

            <!-- Botón Cambiar Misterio (Solo visible rezando) -->
            <button id="changeMysteryBtn" onclick="showHomeScreen()" class="hidden px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/15 text-xs font-semibold text-white items-center gap-1.5 transition-all">
                <i class="ph ph-squares-four text-sm"></i>
                <span>Misterios</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL (1 SOLA PANTALLA SIN SCROLL VERTICAL EN ESCRITORIO) -->
    <main class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-center overflow-hidden">

        <!-- =======================================================
             1. PANTALLA INICIAL: SELECCIÓN DE LOS 4 MISTERIOS
             ======================================================= -->
        <section id="homeScreen" class="w-full max-w-4xl mx-auto flex flex-col justify-center space-y-5">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/15 border border-amber-400/30 text-amber-300 text-xs font-semibold">
                    <i class="ph-fill ph-calendar-check"></i>
                    <span id="todayRecommendationText">Cargando misterio de hoy...</span>
                </div>
                <h1 class="font-display font-extrabold text-2xl sm:text-4xl text-white">
                    Selecciona el Misterio para Rezar
                </h1>
            </div>

            <!-- 4 Opciones de Misterios -->
            <div id="mysteryGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                <!-- Generado dinámicamente por JS -->
            </div>
        </section>

        <!-- =======================================================
             2. PANTALLA DE ORACIÓN: TODO JUNTO LADO A LADO
             ======================================================= -->
        <section id="prayerScreen" class="hidden w-full h-full max-h-[620px] grid grid-cols-12 gap-3 sm:gap-6 items-stretch">

            <!-- COLUMNA IZQUIERDA (5 cols): MANO REALISTA PASANDO EL ROSARIO + IMAGEN DEL MISTERIO -->
            <div class="col-span-5 flex flex-col gap-3 h-full overflow-hidden">

                <!-- 1. TARJETA DE LA IMAGEN DEL MISTERIO -->
                <div class="glass rounded-2xl p-2.5 sm:p-3 flex flex-col shrink-0">
                    <div class="flex items-center justify-between mb-1.5 px-1">
                        <span id="sceneBadge" class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-amber-300 truncate">
                            Escena del Misterio
                        </span>
                        <span id="stepProgressBadge" class="text-[10px] sm:text-xs font-semibold text-slate-400 shrink-0">
                            1 / 70
                        </span>
                    </div>
                    <!-- Imagen estática y detallada de lo que sucede en el misterio -->
                    <div id="mysteryArtBox" class="w-full h-32 sm:h-44 rounded-xl overflow-hidden bg-slate-950 border border-white/15 relative flex items-center justify-center shadow-inner">
                        <!-- Imagen del misterio inyectada dinámicamente -->
                    </div>
                </div>

                <!-- 2. ROSARIO REALISTA EN MANO CON ANIMACIÓN AL PASAR CADA CUENTA -->
                <div onclick="nextStep()" title="Toca para pasar la siguiente cuenta" class="glass rounded-2xl flex-1 relative overflow-hidden flex flex-col items-center justify-center cursor-pointer group border border-white/10 hover:border-amber-400/40 transition-colors">
                    
                    <div class="absolute top-2.5 left-3 right-3 flex items-center justify-between z-10 pointer-events-none">
                        <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-300 bg-slate-950/70 px-2.5 py-1 rounded-full border border-white/10">
                            <i class="ph-fill ph-hand-pointing text-amber-400 mr-1"></i>Toca para pasar cuenta
                        </span>
                        <span id="beadCounterPill" class="text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30">
                            Cruz
                        </span>
                    </div>

                    <!-- Lienzo SVG de la Mano sosteniendo y deslizando las cuentas 3D -->
                    <svg id="handRosarySvg" viewBox="0 0 320 340" class="w-full h-full max-h-[340px] select-none">
                        <defs>
                            <!-- Gradientes realistas de piel para la mano -->
                            <linearGradient id="skinMain" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#e8b496" />
                                <stop offset="55%" stop-color="#d19473" />
                                <stop offset="100%" stop-color="#a66c4e" />
                            </linearGradient>
                            <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#b87b5c" />
                                <stop offset="100%" stop-color="#7c4b33" />
                            </linearGradient>
                            <linearGradient id="skinThumb" x1="15%" y1="0%" x2="85%" y2="100%">
                                <stop offset="0%" stop-color="#f2c2a7" />
                                <stop offset="65%" stop-color="#d99b79" />
                                <stop offset="100%" stop-color="#a86d4f" />
                            </linearGradient>

                            <!-- Gradiente 3D para Cuentas Ave María (Madera de Olivo Pulida con Barniz) -->
                            <radialGradient id="beadWood3D" cx="32%" cy="28%" r="68%">
                                <stop offset="0%" stop-color="#fef3c7" />
                                <stop offset="18%" stop-color="#f59e0b" />
                                <stop offset="52%" stop-color="#b45309" />
                                <stop offset="84%" stop-color="#451a03" />
                                <stop offset="100%" stop-color="#1c0a00" />
                            </radialGradient>

                            <!-- Gradiente 3D para Cuenta Activa Iluminada (Ámbar / Oro Celeste) -->
                            <radialGradient id="beadActive3D" cx="32%" cy="28%" r="70%">
                                <stop offset="0%" stop-color="#ffffff" />
                                <stop offset="25%" stop-color="#fef08a" />
                                <stop offset="60%" stop-color="#f59e0b" />
                                <stop offset="88%" stop-color="#b45309" />
                                <stop offset="100%" stop-color="#78350f" />
                            </radialGradient>

                            <!-- Gradiente 3D para Cuentas Padre Nuestro (Perla Nacarada / Lapislázuli) -->
                            <radialGradient id="beadFather3D" cx="30%" cy="26%" r="70%">
                                <stop offset="0%" stop-color="#ffffff" />
                                <stop offset="25%" stop-color="#e0f2fe" />
                                <stop offset="58%" stop-color="#38bdf8" />
                                <stop offset="86%" stop-color="#0369a1" />
                                <stop offset="100%" stop-color="#082f49" />
                            </radialGradient>

                            <!-- Gradiente Metálico de Plata/Oro para Cadena, Casquillos y Crucifijo -->
                            <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff" />
                                <stop offset="45%" stop-color="#cbd5e1" />
                                <stop offset="80%" stop-color="#64748b" />
                                <stop offset="100%" stop-color="#1e293b" />
                            </linearGradient>
                            <linearGradient id="goldCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fef9c3" />
                                <stop offset="30%" stop-color="#facc15" />
                                <stop offset="70%" stop-color="#d97706" />
                                <stop offset="100%" stop-color="#451a03" />
                            </linearGradient>

                            <!-- Sombra proyectada realista para cada cuenta y cruz -->
                            <filter id="beadDropShadow" x="-30%" y="-30%" width="160%" height="160%">
                                <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.65" />
                            </filter>

                            <!-- Filtro de resplandor para la cuenta que se está rezando -->
                            <filter id="activeBeadGlow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="5.5" result="blur" />
                                <feMerge>
                                    <feMergeNode in="blur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- Halo de luz detrás de la cuenta activa entre los dedos -->
                        <circle id="activeHaloGlow" cx="152" cy="168" r="38" fill="#f59e0b" fill-opacity="0.22" filter="url(#activeBeadGlow)" />

                        <!-- CAPA 1: DEDOS DEL FONDO Y PALMA DE LA MANO QUE SOSTIENE EL ROSARIO -->
                        <g id="backHandLayer">
                            <!-- Muñeca y Palma en sombra -->
                            <path d="M 235 340 C 215 295, 195 260, 175 215 C 165 190, 185 155, 225 162 C 265 170, 295 225, 315 340 Z" fill="url(#skinShadow)" />
                            <!-- Dedo Índice (arriba sosteniendo la caída de la cadena) -->
                            <path d="M 225 182 C 195 162, 160 154, 128 158 C 114 160, 110 176, 124 182 C 152 192, 185 198, 215 212 Z" fill="url(#skinMain)" stroke="#8c5438" stroke-width="1" />
                            <!-- Dedo Medio -->
                            <path d="M 230 210 C 195 195, 158 192, 128 198 C 115 202, 114 218, 128 222 C 158 230, 192 232, 222 242 Z" fill="url(#skinShadow)" stroke="#78452b" stroke-width="1" />
                            <!-- Dedo Anular -->
                            <path d="M 232 240 C 198 228, 166 226, 138 232 C 126 235, 126 250, 138 254 C 168 260, 198 262, 228 270 Z" fill="url(#skinShadow)" opacity="0.92" />
                            <!-- Dedo Meñique -->
                            <path d="M 235 268 C 206 258, 178 258, 154 264 C 144 267, 144 280, 155 283 C 180 288, 206 290, 234 296 Z" fill="url(#skinShadow)" opacity="0.85" />
                        </g>

                        <!-- CAPA 2: CADENA Y CUENTAS DEL ROSARIO EN 3D (Se deslizan con animación física) -->
                        <g id="rosaryChainLayer"></g>

                        <!-- CAPA 3: DEDO PULGAR EN PRIMER PLANO (Se mueve empujando cada cuenta al avanzar) -->
                        <g id="thumbGroup">
                            <!-- Cuerpo del Pulgar -->
                            <path d="M 255 295 C 235 255, 215 220, 188 188 C 170 167, 144 160, 135 174 C 127 187, 142 206, 165 222 C 188 238, 202 268, 215 305 Z" 
                                  fill="url(#skinThumb)" stroke="#9c6244" stroke-width="1.2" />
                            <!-- Uña realista del pulgar -->
                            <path d="M 142 173 C 136 179, 139 189, 148 194 C 154 189, 156 181, 151 174 C 148 171, 145 171, 142 173 Z" 
                                  fill="#f7d6c4" opacity="0.85" stroke="#c98e70" stroke-width="0.8" />
                            <!-- Pliegue articular del pulgar -->
                            <path d="M 172 194 Q 166 202 170 210" fill="none" stroke="#a66c4e" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />
                        </g>
                    </svg>
                </div>

            </div>

            <!-- COLUMNA DERECHA (7 cols): MISTERIO ACTUAL + NOMBRE DE LA ORACIÓN + ORACIÓN PARA REZAR -->
            <div class="col-span-7 flex flex-col h-full overflow-hidden">
                <div class="glass rounded-2xl p-4 sm:p-6 flex flex-col justify-between h-full overflow-hidden">

                    <!-- CABECERA: Misterio que se está rezando y Nombre de la Oración -->
                    <div class="border-b border-white/10 pb-3 shrink-0">
                        <div class="flex items-center justify-between gap-2 mb-1">
                            <span id="currentMysteryHeader" class="text-xs sm:text-sm font-bold text-amber-400 tracking-wide truncate">
                                Misterios Gozosos
                            </span>
                            <!-- Indicador visual de las 10 Ave Marías cuando se está en una decena -->
                            <div id="miniDecadeDots" class="hidden items-center gap-1">
                                <!-- 10 puntitos generados por JS -->
                            </div>
                        </div>

                        <!-- Nombre de la Oración Actual -->
                        <h2 id="currentPrayerName" class="font-display font-extrabold text-xl sm:text-3xl text-white tracking-tight leading-tight">
                            Por la señal de la Santa Cruz
                        </h2>
                    </div>

                    <!-- CUERPO CENTRAL: Texto de la Oración para rezar -->
                    <div id="prayerTextBox" class="prayer-fade flex-1 my-3 overflow-y-auto pr-1 flex flex-col justify-center">
                        <div id="currentPrayerBody" class="text-sm sm:text-lg lg:text-xl text-slate-100 leading-relaxed space-y-3 font-normal">
                            <!-- Oración inyectada por JS -->
                        </div>
                    </div>

                    <!-- CONTROLES INFERIORES: Anterior / Siguiente Cuenta -->
                    <div class="pt-3 border-t border-white/10 flex items-center justify-between gap-2.5 shrink-0">
                        <button id="prevBtn" onclick="prevStep()" class="px-3.5 sm:px-5 py-3 rounded-xl bg-white/5 hover:bg-white/10 active:scale-95 border border-white/10 text-slate-200 font-semibold text-xs sm:text-sm flex items-center gap-1.5 transition-all disabled:opacity-30 disabled:pointer-events-none">
                            <i class="ph-bold ph-arrow-left"></i>
                            <span>Anterior</span>
                        </button>

                        <button id="nextBtn" onclick="nextStep()" class="flex-1 py-3 px-4 sm:px-6 rounded-xl bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 text-slate-950 font-display font-bold text-sm sm:text-base shadow-lg shadow-amber-500/20 hover:brightness-110 active:scale-95 flex items-center justify-center gap-2 transition-all">
                            <span id="nextBtnLabel">Pasar Cuenta</span>
                            <i class="ph-bold ph-arrow-right text-lg"></i>
                        </button>
                    </div>

                </div>
            </div>

        </section>

        <!-- =======================================================
             3. MODAL FINAL: ÁNGELUS COMPLETADO + 30 FRASES DE SANTOS CANÓNICOS
             ======================================================= -->
        <section id="completionModal" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-xl flex items-center justify-center p-4">
            <div class="glass max-w-lg w-full rounded-3xl p-6 sm:p-8 text-center border border-amber-400/30 shadow-2xl space-y-5">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 mx-auto flex items-center justify-center text-slate-950 shadow-lg shadow-amber-500/25">
                    <i class="ph-fill ph-sparkle text-3xl"></i>
                </div>

                <div class="space-y-1">
                    <span class="text-xs font-bold uppercase tracking-widest text-amber-400">¡Rosario y Ángelus Completados!</span>
                    <h2 class="font-display font-extrabold text-2xl sm:text-3xl text-white">Palabra de un Santo para ti</h2>
                </div>

                <!-- Caja con la Frase Aleatoria de uno de los 30 Santos Canónicos -->
                <div class="p-5 rounded-2xl bg-slate-900/90 border border-white/10 text-left space-y-3 relative">
                    <p id="saintQuoteText" class="text-base sm:text-lg text-slate-100 italic leading-relaxed">
                        "La Eucaristía es mi autopista hacia el Cielo."
                    </p>
                    <div class="flex items-center justify-between pt-2 border-t border-white/10">
                        <span id="saintAuthorName" class="font-display font-bold text-sm sm:text-base text-amber-400">
                            — San Carlo Acutis
                        </span>
                        <button onclick="pickRandomSaintQuote()" class="text-xs font-semibold text-sky-300 hover:text-sky-200 flex items-center gap-1 bg-sky-500/15 px-2.5 py-1 rounded-lg border border-sky-400/25 transition">
                            <i class="ph-bold ph-shuffle"></i>
                            <span>Otra frase</span>
                        </button>
                    </div>
                </div>

                <div class="flex gap-3 pt-1">
                    <button onclick="restartRosary()" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/15 text-white font-semibold text-sm transition">
                        Rezar de nuevo
                    </button>
                    <button onclick="showHomeScreen()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-display font-bold text-sm shadow-lg shadow-amber-500/20 transition">
                        Volver al Inicio
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        /* =========================================================================
           1. COLECCIÓN DE 30 FRASES DE SANTOS CANÓNICOS DE LA IGLESIA CATÓLICA
           ========================================================================= */
        const CANONICAL_SAINT_QUOTES = [
            { quote: "Todos nacen como originales, pero muchos mueren como fotocopias.", saint: "San Carlo Acutis" },
            { quote: "La Eucaristía es mi autopista hacia el Cielo.", saint: "San Carlo Acutis" },
            { quote: "No tengan miedo. Abran de par en par las puertas a Cristo.", saint: "San Juan Pablo II" },
            { quote: "El Santo Rosario es mi oración predilecta. ¡Plegaria maravillosa en su sencillez y en su profundidad!", saint: "San Juan Pablo II" },
            { quote: "No todos podemos hacer grandes cosas, pero sí podemos hacer cosas pequeñas con un gran amor.", saint: "Santa Teresa de Calcuta" },
            { quote: "La paz comienza con una sonrisa.", saint: "Santa Teresa de Calcuta" },
            { quote: "Nos hiciste, Señor, para Ti, y nuestro corazón está inquieto hasta que descanse en Ti.", saint: "San Agustín de Hipona" },
            { quote: "Ama y haz lo que quieras: si callas, callarás con amor; si corriges, corregirás con amor.", saint: "San Agustín de Hipona" },
            { quote: "Para mí, la oración es un impulso del corazón, una sencilla mirada lanzada hacia el Cielo.", saint: "Santa Teresita del Niño Jesús" },
            { quote: "En el corazón de la Iglesia, que es mi Madre, yo seré el Amor.", saint: "Santa Teresita del Niño Jesús" },
            { quote: "Señor, haz de mí un instrumento de tu paz: donde haya odio, ponga yo amor.", saint: "San Francisco de Asís" },
            { quote: "Comienza haciendo lo que es necesario, después lo que es posible, y de repente estarás haciendo lo imposible.", saint: "San Francisco de Asís" },
            { quote: "Reza, espera y no te preocupes. La preocupación es inútil: Dios es misericordioso y escuchará tu oración.", saint: "San Padre Pío de Pietrelcina" },
            { quote: "El Rosario es el arma de estos tiempos.", saint: "San Padre Pío de Pietrelcina" },
            { quote: "Nada te turbe, nada te espante; todo se pasa, Dios no se muda. Solo Dios basta.", saint: "Santa Teresa de Jesús (de Ávila)" },
            { quote: "En el atardecer de la vida, seremos juzgados en el amor.", saint: "San Juan de la Cruz" },
            { quote: "Donde no hay amor, pon amor y sacarás amor.", saint: "San Juan de la Cruz" },
            { quote: "Si son lo que deben ser, prenderán fuego al mundo entero.", saint: "Santa Catalina de Siena" },
            { quote: "Camina siempre con alegría: un santo triste es un triste santo.", saint: "San Juan Bosco" },
            { quote: "Basta que sean jóvenes para que los ame profundamente.", saint: "San Juan Bosco" },
            { quote: "En todo amar y servir.", saint: "San Ignacio de Loyola" },
            { quote: "Actúa como si todo dependiera de ti, sabiendo que en realidad todo depende de Dios.", saint: "San Ignacio de Loyola" },
            { quote: "Que busques a Cristo, que encuentres a Cristo, que ames a Cristo.", saint: "San Josemaría Escrivá" },
            { quote: "El Santo Rosario es arma poderosa: úsala con confianza y te maravillarás del resultado.", saint: "San Josemaría Escrivá" },
            { quote: "Prefiero el Paraíso.", saint: "San Felipe Neri" },
            { quote: "Solo el amor crea.", saint: "San Maximiliano María Kolbe" },
            { quote: "Jesús, en Vos confío.", saint: "Santa Faustina Kowalska" },
            { quote: "Las acciones hablan más fuerte que las palabras; que tus palabras enseñen y tus acciones hablen.", saint: "San Antonio de Padua" },
            { quote: "Ora y trabaja (Ora et Labora), para que en todo sea Dios glorificado.", saint: "San Benito de Nursia" },
            { quote: "Florece donde Dios te ha plantado con paciencia y dulzura.", saint: "San Francisco de Sales" }
        ];

        /* =========================================================================
           2. TEXTOS DE LAS ORACIONES
           ========================================================================= */
        const PRAYERS = {
            signOfCross: {
                title: "Señal de la Cruz",
                html: `
                    <p class="text-amber-300 font-semibold">Por la señal de la Santa Cruz (+), de nuestros enemigos (+), líbranos Señor, Dios nuestro (+).</p>
                    <p>En el nombre del Padre, y del Hijo, y del Espíritu Santo. <strong class="text-white">Amén.</strong></p>
                `
            },
            creed: {
                title: "El Credo",
                html: `

        // Función auxiliar para dibujar una figura humana sacra con túnica, manto, rostro y aureola
        function paintSacredFigure(ctx, opts) {
            const {
                x, y, scale = 1,
                robeColor = '#e2e8f0',
                mantleColor = '#0284c7',
                skinColor = '#f5cba7',
                hairColor = '#4a2c11',
                halo = true,
                haloColor = '#fde047',
                kneeling = false,
                armsPose = 'prayer', // 'prayer' | 'open' | 'blessing' | 'reaching'
                facing = 0, // -1 izq, 0 frente, 1 der
                crown = false,
                thorns = false,
                wings = false,
                beard = false
            } = opts;

            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Alas de ángel si aplica
            if (wings) {
                const wingGrad = ctx.createLinearGradient(-55, -75, 10, 15);
                wingGrad.addColorStop(0, '#ffffff');
                wingGrad.addColorStop(0.6, '#fef08a');
                wingGrad.addColorStop(1, '#d97706');
                ctx.fillStyle = wingGrad;
                ctx.beginPath();
                ctx.moveTo(-8, -38);
                ctx.bezierCurveTo(-55, -80, -70, -20, -25, 8);
                ctx.bezierCurveTo(-40, -10, -30, -35, -8, -22);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(8, -38);
                ctx.bezierCurveTo(45, -75, 58, -20, 20, 6);
                ctx.closePath();
                ctx.fill();
            }

            // Aureola de santidad
            if (halo) {
                const haloGrad = ctx.createRadialGradient(0, -56, 4, 0, -56, 26);
                haloGrad.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
                haloGrad.addColorStop(0.65, 'rgba(245, 158, 11, 0.45)');
                haloGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
                ctx.fillStyle = haloGrad;
                ctx.beginPath();
                ctx.arc(0, -56, 26, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = haloColor;
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.arc(0, -56, 18, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Sombra en el suelo
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(0, kneeling ? 26 : 42, 24, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Túnica principal
            const bodyHeight = kneeling ? 26 : 42;
            const robeGrad = ctx.createLinearGradient(-20, -38, 22, bodyHeight);
            robeGrad.addColorStop(0, robeColor);
            robeGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = robeGrad;
            ctx.beginPath();
            ctx.moveTo(-14, -36);
            ctx.quadraticCurveTo(-24, 0, kneeling ? -26 : -22, bodyHeight);
            ctx.lineTo(kneeling ? 28 : 22, bodyHeight);
            ctx.quadraticCurveTo(24, 0, 14, -36);
            ctx.closePath();
            ctx.fill();

            // Manto exterior con pliegues
            const mantleGrad = ctx.createLinearGradient(-22, -42, 22, bodyHeight);
            mantleGrad.addColorStop(0, mantleColor);
            mantleGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = mantleGrad;
            ctx.beginPath();
            ctx.moveTo(-16, -38);
            ctx.quadraticCurveTo(-28, -5, -24, bodyHeight - 2);
            ctx.lineTo(-6, bodyHeight - 2);
            ctx.quadraticCurveTo(-8, -10, 0, -34);
            ctx.quadraticCurveTo(10, -10, 8, bodyHeight - 2);
            ctx.lineTo(24, bodyHeight - 2);
            ctx.quadraticCurveTo(28, -5, 16, -38);
            ctx.closePath();
            ctx.fill();

            // Cuello y Cabeza
            ctx.fillStyle = skinColor;
            ctx.fillRect(-4, -45, 8, 9);
            ctx.beginPath();
            ctx.arc(0, -55, 11.5, 0, Math.PI * 2);
            ctx.fill();

            // Cabello o Velo
            ctx.fillStyle = hairColor;
            ctx.beginPath();
            ctx.arc(0, -57, 12, Math.PI * 0.85, Math.PI * 2.15);
            ctx.fill();

            // Barba si es Jesús / José / Apóstol
            if (beard) {
                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.moveTo(-9, -52);
                ctx.quadraticCurveTo(0, -39, 9, -52);
                ctx.quadraticCurveTo(0, -45, -9, -52);
                ctx.fill();
            }

            // Rasgos faciales suaves y serenos
            ctx.strokeStyle = 'rgba(69, 26, 3, 0.65)';
            ctx.lineWidth = 1.1;
            const eyeOffset = facing * 2.5;
            ctx.beginPath();
            ctx.arc(-3.5 + eyeOffset, -55, 1.5, 0, Math.PI);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(3.5 + eyeOffset, -55, 1.5, 0, Math.PI);
            ctx.stroke();

            // Corona real o corona de espinas
            if (crown) {
                ctx.fillStyle = '#fbbf24';
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-10, -64);
                ctx.lineTo(-8, -74);
                ctx.lineTo(-3, -67);
                ctx.lineTo(0, -76);
                ctx.lineTo(3, -67);
                ctx.lineTo(8, -74);
                ctx.lineTo(10, -64);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            if (thorns) {
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.ellipse(0, -62, 12, 4, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#e11d48';
                ctx.beginPath();
                ctx.arc(-5, -59, 1.3, 0, Math.PI * 2);
                ctx.arc(4, -58, 1.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Brazos y manos según la pose
            ctx.strokeStyle = robeColor;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            if (armsPose === 'prayer') {
                ctx.beginPath();
                ctx.moveTo(-13, -32);
                ctx.quadraticCurveTo(-8, -16, -2, -24);
                ctx.moveTo(13, -32);
                ctx.quadraticCurveTo(8, -16, 2, -24);
                ctx.stroke();
                // Manos juntas
                ctx.fillStyle = skinColor;
                ctx.beginPath();
                ctx.ellipse(0, -26, 3.5, 5, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (armsPose === 'open') {
                ctx.beginPath();
                ctx.moveTo(-14, -32);
                ctx.quadraticCurveTo(-24, -22, -30, -28);
                ctx.moveTo(14, -32);
                ctx.quadraticCurveTo(24, -22, 30, -28);
                ctx.stroke();
                ctx.fillStyle = skinColor;
                ctx.beginPath();
                ctx.arc(-31, -29, 3.5, 0, Math.PI * 2);
                ctx.arc(31, -29, 3.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (armsPose === 'reaching') {
                const dir = facing || 1;
                ctx.beginPath();
                ctx.moveTo(dir * 10, -32);
                ctx.quadraticCurveTo(dir * 20, -26, dir * 28, -32);
                ctx.stroke();
                ctx.fillStyle = skinColor;
                ctx.beginPath();
                ctx.arc(dir * 29, -32, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Dibuja la paloma del Espíritu Santo con rayos de luz
        function paintHolySpiritDove(ctx, x, y, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 42);
            glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            glow.addColorStop(0.4, 'rgba(253, 224, 71, 0.45)');
            glow.addColorStop(1, 'rgba(253, 224, 71, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 42, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -4);
            ctx.bezierCurveTo(-18, -22, -34, -10, -22, 4);
            ctx.quadraticCurveTo(-10, 4, -5, 12);
            ctx.lineTo(0, 8);
            ctx.lineTo(5, 12);
            ctx.quadraticCurveTo(10, 4, 22, 4);
            ctx.bezierCurveTo(34, -10, 18, -22, 0, -4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Genera una pintura sacra completa en alta resolución y devuelve un Data URL para usar en <img>
        function generateMysteryPaintingDataUrl(artType, themeColor) {
            const cacheKey = `${artType}_${themeColor}`;
            if (MYSTERY_IMAGE_CACHE[cacheKey]) return MYSTERY_IMAGE_CACHE[cacheKey];

            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            // 1. Fondo atmosférico de óleo / vitral según el misterio
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
            if (['garden', 'crucifixion', 'nativity', 'eucharist'].includes(artType)) {
                skyGrad.addColorStop(0, '#090d1e');
                skyGrad.addColorStop(0.55, '#1e1b4b');
                skyGrad.addColorStop(1, '#31102f');
            } else if (['pillar', 'crown_thorns', 'carrying_cross'].includes(artType)) {
                skyGrad.addColorStop(0, '#1f0812');
                skyGrad.addColorStop(0.6, '#4c0519');
                skyGrad.addColorStop(1, '#1e1b2e');
            } else if (['resurrection', 'ascension', 'assumption', 'coronation', 'transfiguration'].includes(artType)) {
                skyGrad.addColorStop(0, '#1e1b4b');
                skyGrad.addColorStop(0.45, '#3b0764');
                skyGrad.addColorStop(1, '#78350f');
            } else {
                skyGrad.addColorStop(0, '#0c192c');
                skyGrad.addColorStop(0.55, '#1e3a5f');
                skyGrad.addColorStop(1, '#3b2818');
            }
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 640, 300);

            // Estrellas suaves y textura de lienzo
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            const starCoords = [[55, 34], [120, 22], [210, 48], [430, 28], [520, 42], [585, 25], [85, 75], [560, 82]];
            starCoords.forEach(([sx, sy]) => {
                ctx.beginPath();
                ctx.arc(sx, sy, 1.3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Resplandor divino central
            const centerGlow = ctx.createRadialGradient(320, 120, 15, 320, 120, 240);
            centerGlow.addColorStop(0, 'rgba(253, 224, 71, 0.35)');
            centerGlow.addColorStop(0.5, 'rgba(245, 158, 11, 0.12)');
            centerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, 640, 300);

            // 2. Composición pictórica específica de cada uno de los 20 misterios
            switch (artType) {
                case 'intro': {
                    // Altar luminoso con la Santa Cruz y el Rosario
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.moveTo(0, 240);
                    ctx.quadraticCurveTo(320, 195, 640, 240);
                    ctx.lineTo(640, 300);
                    ctx.lineTo(0, 300);
                    ctx.fill();

                    // Rayos dorados desde la Cruz
                    for (let i = 0; i < 12; i++) {
                        const ang = (i / 12) * Math.PI * 2;
                        ctx.strokeStyle = 'rgba(253, 224, 71, 0.16)';
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.moveTo(320, 125);
                        ctx.lineTo(320 + Math.cos(ang) * 260, 125 + Math.sin(ang) * 260);
                        ctx.stroke();
                    }

                    // Cruz de madera y oro
                    ctx.fillStyle = '#b45309';
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 3;
                    ctx.fillRect(309, 42, 22, 175);
                    ctx.strokeRect(309, 42, 22, 175);
                    ctx.fillRect(255, 84, 130, 22);
                    ctx.strokeRect(255, 84, 130, 22);
                    break;
                }

                case 'annunciation': {
                    // Suelo y columnas de Nazaret
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(0, 215, 640, 85);
                    ctx.fillStyle = '#334155';
                    ctx.fillRect(70, 20, 26, 195);
                    ctx.fillRect(544, 20, 26, 195);

                    // Rayo de luz celestial desde el Espíritu Santo hacia María
                    const beam = ctx.createLinearGradient(200, 10, 415, 200);
                    beam.addColorStop(0, 'rgba(254, 249, 195, 0.55)');
                    beam.addColorStop(1, 'rgba(253, 224, 71, 0.05)');
                    ctx.fillStyle = beam;
                    ctx.beginPath();
                    ctx.moveTo(190, 0);
                    ctx.lineTo(265, 0);
                    ctx.lineTo(455, 215);
                    ctx.lineTo(355, 215);
                    ctx.closePath();
                    ctx.fill();

                    paintHolySpiritDove(ctx, 295, 52, 0.9);
                    // Arcángel San Gabriel a la izquierda
                    paintSacredFigure(ctx, {
                        x: 220, y: 182, scale: 1.08,
                        robeColor: '#fef9c3', mantleColor: '#f59e0b',
                        hairColor: '#b45309', wings: true, armsPose: 'reaching', facing: 1
                    });
                    // Virgen María arrodillada a la derecha

            // Texto descriptivo en la parte inferior de la imagen
            const caption = MYSTERY_CAPTIONS[artType] || MYSTERY_CAPTIONS.intro;
            ctx.fillStyle = '#fef3c7';
            ctx.font = '600 15px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(caption, 320, 276);

            const dataUrl = canvas.toDataURL('image/png');
            MYSTERY_IMAGE_CACHE[cacheKey] = dataUrl;
            return dataUrl;
        }

        function getSceneIllustration(artType, color) {
            const imgSrc = generateMysteryPaintingDataUrl(artType, color);
            const altText = MYSTERY_CAPTIONS[artType] || 'Imagen del Misterio del Rosario';
            return `
                <img src="${imgSrc}" alt="${altText}" class="w-full h-full object-cover select-none" draggable="false" />
            `;
        }

        /* =========================================================================
           5. CONSTRUCCIÓN DE LA SECUENCIA COMPLETA DEL ROSARIO
           ========================================================================= */
        let currentMysteryKey = 'luminosos';
        let stepsSequence = [];
        let currentStepIndex = 0;

        // Estado físico para la animación fluida y movimiento suave continuo de las cuentas en la mano
        let visualBeadIndex = 0;
        let targetBeadIndex = 0;
        let swayPhase = 0;
        let impulseSway = 0;

        function buildStepsForMystery(mysteryKey) {
            const mGroup = MYSTERIES_DATA[mysteryKey];
            const list = [];
            let physicalPos = 0;

            // 1. Señal de la Cruz (Se reza sosteniendo la única Santa Cruz: posición física 0)
            list.push({
                beadKind: 'cross',
                physicalSlot: physicalPos,
                pillText: 'Santa Cruz',
                mysteryHeader: `Inicio • ${mGroup.name}`,
                prayerName: PRAYERS.signOfCross.title,
                prayerHtml: PRAYERS.signOfCross.html,
                art: 'intro'
            });

            // 2. Credo (Se reza sobre esa misma Santa Cruz, sin duplicar otra cruz en la cadena)
            list.push({
                beadKind: 'cross',
                physicalSlot: physicalPos,
                pillText: 'Santa Cruz • Credo',
                mysteryHeader: `Inicio • ${mGroup.name}`,
                prayerName: PRAYERS.creed.title,
                prayerHtml: PRAYERS.creed.html,
                art: 'intro'
            });

            // 3. Pésame (Primera cuenta grande luego del Crucifijo)
            physicalPos++;
            list.push({
                beadKind: 'father',
                physicalSlot: physicalPos,
                pillText: 'Cuenta • Pésame',
                mysteryHeader: `Inicio • ${mGroup.name}`,
                prayerName: PRAYERS.pesame.title,
                prayerHtml: PRAYERS.pesame.html,
                art: 'intro'
            });

            // 4. Los 5 Misterios (Anuncio en Grande + Padre Nuestro + 10 Ave Marías + Gloria + Fátima)
            mGroup.items.forEach((mItem, idx) => {
                const mNum = idx + 1;

                // Anuncio del Misterio en Grande antes de rezar la decena
                physicalPos++;
                const mysteryCaption = MYSTERY_CAPTIONS[mItem.art] || '';
                list.push({
                    beadKind: 'father',
                    isAnnouncement: true,
                    physicalSlot: physicalPos,
                    pillText: `${mNum}° Misterio • Anuncio`,
                    mysteryHeader: `${mGroup.name} • ${mNum}° Misterio`,
                    prayerName: `Misterio a Meditar`,
                    prayerHtml: `
                        <div class="py-2 sm:py-4 flex flex-col items-center justify-center text-center space-y-3 sm:space-y-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-400/20 text-amber-300 border border-amber-400/30 shadow-sm shadow-amber-500/10">
                                <i class="ph-bold ph-book-open-text text-sm"></i>
                                Meditación del Misterio
                            </span>
                            <h1 class="text-xl sm:text-3xl md:text-4xl font-extrabold text-white font-display tracking-tight leading-snug text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-orange-400 drop-shadow-md">
                                ${mItem.title}
                            </h1>
                            ${mysteryCaption ? `<p class="text-sm sm:text-lg text-slate-200 italic max-w-xl font-medium leading-relaxed bg-white/5 border border-white/10 rounded-xl px-4 py-3 shadow-inner">"${mysteryCaption}"</p>` : ''}
                            <div class="pt-1 sm:pt-2 flex items-center justify-center gap-2 text-xs sm:text-sm text-amber-300/90 font-medium">
                                <i class="ph-bold ph-hand-pointing"></i>
                                <span>Toca <strong>«Comenzar Misterio»</strong> para rezar el Padre Nuestro y las 10 Ave Marías</span>
                            </div>
                        </div>
                    `,
                    art: mItem.art,
                    mysteryNumber: mNum
                });

                // Padre Nuestro (comparte la misma cuenta grande física)
                list.push({
                    beadKind: 'father',
                    physicalSlot: physicalPos,
                    pillText: `${mNum}° Misterio • P. Nuestro`,
                    mysteryHeader: mItem.title,
                    prayerName: 'Padre Nuestro',
                    prayerHtml: PRAYERS.ourFather.html,
                    art: mItem.art,
                    mysteryNumber: mNum
                });

                // 10 Ave Marías
                for (let ave = 1; ave <= 10; ave++) {
                    physicalPos++;
                    list.push({
                        beadKind: 'ave',
                        aveNumber: ave,
                        physicalSlot: physicalPos,
                        pillText: `Ave María ${ave}/10`,
                        mysteryHeader: mItem.title,
                        prayerName: `Ave María (${ave} de 10)`,
                        prayerHtml: PRAYERS.hailMary.html,
                        art: mItem.art,
                        mysteryNumber: mNum
                    });
                }

                // Gloria y Oración de Fátima (se rezan en el engarce / espacio antes del siguiente misterio)
                physicalPos++;
                list.push({
                    beadKind: 'space_glory',
                    physicalSlot: physicalPos,
                    pillText: `${mNum}° Misterio • Gloria`,
                    mysteryHeader: mItem.title,
                    prayerName: PRAYERS.glory.title,
                    prayerHtml: PRAYERS.glory.html,
                    art: mItem.art,
                    mysteryNumber: mNum
                });

                list.push({
                    beadKind: 'space_fatima',
                    physicalSlot: physicalPos,
                    pillText: `${mNum}° Misterio • Fátima`,
                    mysteryHeader: mItem.title,
                    prayerName: PRAYERS.fatima.title,
                    prayerHtml: PRAYERS.fatima.html,
                    art: mItem.art,
                    mysteryNumber: mNum
                });
            });

            // 5. Al finalizar los 5 misterios: El Ángelus en la Medalla Central
            physicalPos++;
            list.push({
                beadKind: 'medal',
                physicalSlot: physicalPos,
                pillText: 'Medalla • Ángelus',
                mysteryHeader: 'Oración Final del Rosario',
                prayerName: PRAYERS.angelus.title,
                prayerHtml: PRAYERS.angelus.html,
                art: 'angelus'
            });

            return list;
        }

        // Devuelve la lista de piezas físicas únicas del rosario (sin duplicar la cruz ni los engarces)
        function getUniquePhysicalBeads() {
            const map = new Map();
            stepsSequence.forEach((step, idx) => {
                if (!map.has(step.physicalSlot)) {
                    map.set(step.physicalSlot, { ...step, stepIndices: [idx] });
                } else {
                    map.get(step.physicalSlot).stepIndices.push(idx);
                }
            });
            return Array.from(map.values());
        }

        /* =========================================================================
           6. RENDERIZADO REALISTA DEL ROSARIO EN LA MANO Y ANIMACIÓN DE DESLIZAMIENTO
           ========================================================================= */
        // Curva orgánica con balanceo suave por donde pasa el cordón del rosario entre el índice y el pulgar
        function getCordPoint(offsetSlots) {
            // offsetSlots = 0 es exactamente donde pellizcan el pulgar y el índice (x=150, y=168)
            const y = 168 + offsetSlots * 46;

            // Balanceo tipo péndulo: más pronunciado en las cuentas que cuelgan hacia abajo (offsetSlots > 0)
            const hangingFactor = Math.max(0, offsetSlots + 0.35);
            const naturalSway = Math.sin(swayPhase + offsetSlots * 0.55) * (1.8 + hangingFactor * 2.1);
            const pushWave = Math.sin(offsetSlots * 0.9) * impulseSway * (1 + hangingFactor * 0.5);

            // Curvatura natural del rosario cayendo sobre la mano
            const curveX = Math.sin(offsetSlots * 0.42) * 12 - (offsetSlots < 0 ? Math.pow(Math.abs(offsetSlots), 1.25) * 6 : 0);
            const x = 150 + curveX + naturalSway + pushWave;
            return { x, y };
        }

        function renderHandRosaryFrame(continuousPhysicalSlot) {
            const layer = document.getElementById('rosaryChainLayer');
            if (!layer || !stepsSequence.length) return;
            layer.innerHTML = '';

            const physicalBeads = getUniquePhysicalBeads();
            const maxSlot = physicalBeads.length - 1;

            // Limitar el dibujo de la cadena únicamente desde la Cruz (slot 0) hasta la Medalla final
            const startS = Math.max(-0.15 - continuousPhysicalSlot, -3.6);
            const endS = Math.min(maxSlot - continuousPhysicalSlot + 0.35, 4.6);

            // 1. Dibujar eslabones entrelazados realistas de plata para la cadena
            let pathD = '';
            const linkPoints = [];
            for (let s = startS; s <= endS; s += 0.2) {
                const pt = getCordPoint(s);
                linkPoints.push(pt);
                pathD += (pathD === '' ? `M ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}` : ` L ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`);
            }

            if (pathD) {
                // Sombra profunda de la cadena
                const chainShadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                chainShadow.setAttribute('d', pathD);
                chainShadow.setAttribute('fill', 'none');
                chainShadow.setAttribute('stroke', 'rgba(2, 6, 23, 0.85)');
                chainShadow.setAttribute('stroke-width', '5.5');
                chainShadow.setAttribute('stroke-linecap', 'round');
                layer.appendChild(chainShadow);

                // Hilo central metálico
                const chainCore = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                chainCore.setAttribute('d', pathD);
                chainCore.setAttribute('fill', 'none');
                chainCore.setAttribute('stroke', '#64748b');
                chainCore.setAttribute('stroke-width', '2.2');
                layer.appendChild(chainCore);

                // Eslabones ovalados de plata con brillo especular
                const chainMetal = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                chainMetal.setAttribute('d', pathD);
                chainMetal.setAttribute('fill', 'none');
                chainMetal.setAttribute('stroke', 'url(#metalSilver)');
                chainMetal.setAttribute('stroke-width', '3.6');
                chainMetal.setAttribute('stroke-linecap', 'round');
                chainMetal.setAttribute('stroke-dasharray', '4 5');
                layer.appendChild(chainMetal);
            }

            // 2. Dibujar cada cuenta física única cercana a la mano
            const activePhysicalSlot = stepsSequence[currentStepIndex]?.physicalSlot ?? 0;

            physicalBeads.forEach((bead) => {
                const relativeSlot = bead.physicalSlot - continuousPhysicalSlot; // 0 = exactamente en los dedos
                if (relativeSlot < -3.6 || relativeSlot > 4.6) return;

                const pt = getCordPoint(relativeSlot);
                const ptAbove = getCordPoint(relativeSlot - 0.22);
                const ptBelow = getCordPoint(relativeSlot + 0.22);
                const angleDeg = Math.atan2(ptBelow.x - ptAbove.x, ptBelow.y - ptAbove.y) * (-180 / Math.PI) * 0.45;

                const isActive = bead.physicalSlot === activePhysicalSlot;
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                if (bead.beadKind === 'cross') {
                    // ÚNICO CRUCIFIJO REALISTA 3D (Madera noble incrustada en oro + Cristo en relieve + INRI)
                    const crossRot = angleDeg + Math.sin(swayPhase * 1.1) * 2.2;
                    g.innerHTML = `
                        <g transform="translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) rotate(${crossRot.toFixed(2)})" filter="url(#beadDropShadow)">
                            ${isActive ? `<circle cx="0" cy="6" r="28" fill="#f59e0b" fill-opacity="0.28" filter="url(#activeBeadGlow)"/>` : ''}
                            <!-- Argolla superior de engarce -->
                            <circle cx="0" cy="-26" r="4.2" fill="none" stroke="url(#goldCrossGrad)" stroke-width="2.4"/>
                            <!-- Base biselada de oro del Crucifijo -->
                            <rect x="-6.5" y="-23" width="13" height="54" rx="3" fill="url(#goldCrossGrad)" stroke="${isActive ? '#ffffff' : '#fef08a'}" stroke-width="${isActive ? 1.8 : 0.9}"/>
                            <rect x="-20" y="-11" width="40" height="12" rx="3" fill="url(#goldCrossGrad)" stroke="${isActive ? '#ffffff' : '#fef08a'}" stroke-width="${isActive ? 1.8 : 0.9}"/>
                            <!-- Interior de madera de ébano/olivo -->
                            <rect x="-4" y="-20.5" width="8" height="49" rx="1.5" fill="#451a03"/>
                            <rect x="-17.5" y="-8.5" width="35" height="7" rx="1.5" fill="#451a03"/>
                            <!-- Cartela INRI -->
                            <rect x="-4.5" y="-18" width="9" height="3.5" rx="0.8" fill="#fef08a"/>
                            <!-- Figura estilizada en relieve dorado del Cuerpo de Cristo -->
                            <path d="M -12 -5.5 Q 0 -3 12 -5.5 M 0 -8 V 14 M -3 14 L 0 7 L 3 14" stroke="#fde68a" stroke-width="2.1" stroke-linecap="round" fill="none"/>
                            <circle cx="0" cy="-8.5" r="2.8" fill="#fef08a"/>
                        </g>
                    `;
                } else if (bead.beadKind === 'medal') {
                    // MEDALLA MILAGROSA CENTRAL (Biselada en oro y plata con relieve mariano)
                    g.innerHTML = `
                        <g transform="translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) rotate(${angleDeg.toFixed(2)})" filter="url(#beadDropShadow)">
                            <circle cx="0" cy="-19" r="3" fill="none" stroke="url(#metalSilver)" stroke-width="2"/>
                            <circle cx="0" cy="19" r="3" fill="none" stroke="url(#metalSilver)" stroke-width="2"/>
                            <ellipse cx="0" cy="0" rx="14.5" ry="18.5" fill="url(#goldCrossGrad)" stroke="${isActive ? '#ffffff' : '#fef08a'}" stroke-width="${isActive ? 2.2 : 1.2}"/>
                            <ellipse cx="0" cy="0" rx="11" ry="14.5" fill="#0c4a6e" stroke="#bae6fd" stroke-width="0.9"/>
                            <text x="0" y="4.5" text-anchor="middle" fill="#fef08a" font-size="11.5" font-weight="800" font-family="serif">M</text>
                            <ellipse cx="-4" cy="-6" rx="4" ry="2" transform="rotate(-25 -4 -6)" fill="#ffffff" opacity="0.45"/>
                        </g>
                    `;
                } else if (bead.beadKind === 'father') {
                    // CUENTA GRANDE DEL PADRE NUESTRO / PÉSAME (Esfera de nácar/lapislázuli con casquillos de filigrana)
                    const r = isActive ? 15.8 : 13.8;
                    g.innerHTML = `
                        <g transform="translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) rotate(${angleDeg.toFixed(2)})" filter="url(#beadDropShadow)">
                            <!-- Casquillos metálicos superior e inferior (Capuchones de filigrana) -->
                            <path d="M -6 -${r + 2.2} Q 0 -${r + 5} 6 -${r + 2.2} L 8 -${r - 2} Q 0 -${r} -8 -${r - 2} Z" fill="url(#goldCrossGrad)" stroke="#fef08a" stroke-width="0.6"/>
                            <path d="M -6 ${r + 2.2} Q 0 ${r + 5} 6 ${r + 2.2} L 8 ${r - 2} Q 0 ${r} -8 ${r - 2} Z" fill="url(#goldCrossGrad)" stroke="#fef08a" stroke-width="0.6"/>
                            <!-- Esfera principal 3D -->
                            <circle cx="0" cy="0" r="${r}" fill="${isActive ? 'url(#beadActive3D)' : 'url(#beadFather3D)'}" 
                                    stroke="${isActive ? '#ffffff' : 'rgba(255,255,255,0.45)'}" stroke-width="${isActive ? 2.2 : 1}"
                                    ${isActive ? 'filter="url(#activeBeadGlow)"' : ''}/>
                            <!-- Anillo ecuatorial sutil tallado en la cuenta -->
                            <ellipse cx="0" cy="0" rx="${r - 0.5}" ry="${r * 0.32}" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>
                            <!-- Doble brillo especular tipo cristal/perla -->
                            <ellipse cx="${-r * 0.32}" cy="${-r * 0.34}" rx="${r * 0.34}" ry="${r * 0.19}" transform="rotate(-28 ${-r * 0.32} ${-r * 0.34})" fill="#ffffff" opacity="0.78"/>
                            <circle cx="${r * 0.32}" cy="${r * 0.34}" r="${r * 0.1}" fill="#ffffff" opacity="0.35"/>
                        </g>
                    `;
                } else if (bead.beadKind === 'ave') {
                    // CUENTA DEL AVE MARÍA (Madera de olivo torneada con vetas orgánicas, casquillos de plata y brillo de barniz)
                    const r = isActive ? 14.4 : 11.8;
                    g.innerHTML = `
                        <g transform="translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) rotate(${angleDeg.toFixed(2)})" filter="url(#beadDropShadow)">
                            <!-- Casquillos de plata en los polos donde entra la cadena -->
                            <ellipse cx="0" cy="${-r + 0.5}" rx="4.2" ry="1.8" fill="url(#metalSilver)"/>
                            <ellipse cx="0" cy="${r - 0.5}" rx="4.2" ry="1.8" fill="url(#metalSilver)"/>
                            <!-- Cuerpo de madera de olivo 3D -->
                            <circle cx="0" cy="0" r="${r}" fill="${isActive ? 'url(#beadActive3D)' : 'url(#beadWood3D)'}" 
                                    stroke="${isActive ? '#ffffff' : 'rgba(253, 230, 138, 0.38)'}" stroke-width="${isActive ? 2 : 0.8}"
                                    ${isActive ? 'filter="url(#activeBeadGlow)"' : ''}/>
                            <!-- Vetas curvas naturales de la madera -->
                            <path d="M ${-r * 0.65} ${-r * 0.2} Q 0 ${r * 0.35} ${r * 0.65} ${-r * 0.15}" fill="none" stroke="#451a03" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
                            <path d="M ${-r * 0.5} ${r * 0.35} Q 0 ${r * 0.6} ${r * 0.55} ${r * 0.25}" fill="none" stroke="#451a03" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>
                            <!-- Brillo especular de madera barnizada -->
                            <ellipse cx="${-r * 0.32}" cy="${-r * 0.32}" rx="${r * 0.3}" ry="${r * 0.16}" transform="rotate(-25 ${-r * 0.32} ${-r * 0.32})" fill="#ffffff" opacity="0.65"/>
                            <!-- Número de Ave María grabado con elegancia -->
                            <text x="0" y="3.8" text-anchor="middle" fill="${isActive ? '#451a03' : '#fef3c7'}" font-size="${isActive ? '10.5' : '9.5'}" font-weight="800">${bead.aveNumber}</text>
                        </g>
                    `;
                } else {
                    // ENGARCE METÁLICO ENTRE DECENAS (Donde se reza el Gloria y la Oración de Fátima)
                    const r = isActive ? 8.5 : 5.8;
                    g.innerHTML = `
                        <g transform="translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)})" filter="url(#beadDropShadow)">
                            <circle cx="0" cy="0" r="${r}" fill="url(#goldCrossGrad)" stroke="#ffffff" stroke-width="${isActive ? 2 : 1}" ${isActive ? 'filter="url(#activeBeadGlow)"' : ''}/>
                            <circle cx="${-r * 0.28}" cy="${-r * 0.28}" r="${r * 0.28}" fill="#ffffff" opacity="0.75"/>
                        </g>
                    `;
                }

                layer.appendChild(g);
            });
        }

        // Bucle de animación suave y continua (interpola el paso de cuentas + el balanceo natural del rosario)
        function startContinuousRosaryLoop() {
            function loop() {
                swayPhase += 0.032;

                // Interpolación suave (lerp con amortiguación orgánica) hacia la cuenta física objetivo
                const diff = targetBeadIndex - visualBeadIndex;
                visualBeadIndex += diff * 0.14;

                // Amortiguación suave del impulso de balanceo al tocar/pasar una cuenta
                impulseSway *= 0.91;

                // Respiración suave del halo luminoso detrás de los dedos
                const halo = document.getElementById('activeHaloGlow');
                if (halo) {
                    const pulseR = 36 + Math.sin(swayPhase * 1.6) * 4;
                    halo.setAttribute('r', pulseR.toFixed(1));
                }

                renderHandRosaryFrame(visualBeadIndex);
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        // Anima el deslizamiento hacia la cuenta física correspondiente y el gesto del pulgar
        function animateToStep(newStepIdx, direction = 1) {
            const stepObj = stepsSequence[newStepIdx];
            const newPhysicalSlot = stepObj ? stepObj.physicalSlot : 0;
            const slotChanged = Math.abs(newPhysicalSlot - targetBeadIndex) > 0.01;

            targetBeadIndex = newPhysicalSlot;
            impulseSway = (direction >= 0 ? 1 : -1) * (slotChanged ? 5.5 : 2.5);

            // Gesto físico del pulgar empujando la cuenta
            const thumb = document.getElementById('thumbGroup');
            if (thumb) {
                thumb.classList.remove('thumb-push-down', 'thumb-push-up');
                thumb.classList.add(direction >= 0 ? 'thumb-push-down' : 'thumb-push-up');
                setTimeout(() => {
                    thumb.classList.remove('thumb-push-down', 'thumb-push-up');
                }, 240);
            }
        }

        /* =========================================================================
           7. ACTUALIZACIÓN DE LA VISTA INTEGRADA (ORACIÓN + ESCENA + ROSARIO)
           ========================================================================= */
        function updatePrayerView(direction = 1) {
            const step = stepsSequence[currentStepIndex];
            const mGroup = MYSTERIES_DATA[currentMysteryKey];
            const total = stepsSequence.length;

            // 1. Animar el rosario en la mano
            animateToStep(currentStepIndex, direction);

            // 2. Actualizar etiqueta de la cuenta y progreso
            document.getElementById('beadCounterPill').textContent = step.pillText;
            document.getElementById('stepProgressBadge').textContent = `${currentStepIndex + 1} / ${total}`;
            document.getElementById('sceneBadge').textContent = mGroup.name;

            // 3. Actualizar la ilustración de lo que sucede en el misterio
            document.getElementById('mysteryArtBox').innerHTML = getSceneIllustration(step.art, mGroup.color);

            // 4. Actualizar Misterio, Nombre de la Oración y Texto para rezar
            document.getElementById('currentMysteryHeader').textContent = step.mysteryHeader;
            document.getElementById('currentPrayerName').textContent = step.prayerName;

            const textBox = document.getElementById('prayerTextBox');
            textBox.classList.remove('prayer-fade');
            void textBox.offsetWidth;
            textBox.classList.add('prayer-fade');
            document.getElementById('currentPrayerBody').innerHTML = step.prayerHtml;

            // 5. Puntitos rápidos de las 10 Ave Marías si estamos dentro de una decena
            const dotsBox = document.getElementById('miniDecadeDots');
            if (step.beadKind === 'ave') {
                dotsBox.classList.remove('hidden');
                dotsBox.classList.add('flex');
                let dotsHtml = '';
                for (let i = 1; i <= 10; i++) {
                    const activeDot = i === step.aveNumber;
                    const passedDot = i < step.aveNumber;
                    dotsHtml += `<span class="w-2 h-2 rounded-full transition-all ${
                        activeDot ? 'w-3 h-3 bg-amber-400 shadow shadow-amber-400' : passedDot ? 'bg-sky-400' : 'bg-slate-700'
                    }"></span>`;
                }
                dotsBox.innerHTML = dotsHtml;
            } else {
                dotsBox.classList.add('hidden');
                dotsBox.classList.remove('flex');
            }

            // 6. Estado de botones Anterior y Siguiente
            document.getElementById('prevBtn').disabled = currentStepIndex === 0;
            const nextLabel = document.getElementById('nextBtnLabel');
            if (currentStepIndex === total - 1) {
                nextLabel.textContent = 'Finalizar Rosario';
            } else if (step.isAnnouncement) {
                nextLabel.textContent = 'Comenzar Misterio';
            } else {
                nextLabel.textContent = 'Pasar Cuenta';
            }
        }

        /* =========================================================================
           8. NAVEGACIÓN Y PANTALLA DE INICIO CON LOS 4 MISTERIOS
           ========================================================================= */
        function getRecommendedMysteryForToday() {
            const day = new Date().getDay();
            for (const key in MYSTERIES_DATA) {
                if (MYSTERIES_DATA[key].dayNumbers.includes(day)) return key;
            }
            return 'gozosos';
        }

        function renderHomeMysteryCards() {
            const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const todayName = dayNames[new Date().getDay()];
            const recommendedKey = getRecommendedMysteryForToday();
            const recGroup = MYSTERIES_DATA[recommendedKey];

            document.getElementById('todayRecommendationText').innerHTML =
                `Hoy es <strong>${todayName}</strong> • Corresponden los <strong>${recGroup.name}</strong>`;

            const grid = document.getElementById('mysteryGrid');
            grid.innerHTML = '';

            Object.values(MYSTERIES_DATA).forEach(m => {
                const isToday = m.id === recommendedKey;
                const btn = document.createElement('button');
                btn.onclick = () => startMystery(m.id);
                btn.className = `glass rounded-2xl p-4 sm:p-5 text-left flex flex-col justify-between transition-all hover:-translate-y-1 hover:border-white/30 ${
                    isToday ? 'ring-2 ring-amber-400 bg-slate-900/90' : ''
                }`;

                btn.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${m.gradient} flex items-center justify-center text-slate-950 shadow-md">
                                <i class="ph-fill ${m.icon} text-xl"></i>
                            </div>
                            ${isToday
                                ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-amber-400 text-slate-950">Hoy</span>`
                                : `<span class="text-[11px] text-slate-400 font-medium">${m.days}</span>`
                            }
                        </div>
                        <div>
                            <h3 class="font-display font-bold text-base sm:text-xl text-white">${m.name}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">${m.days}</p>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-between text-xs font-bold text-amber-400">
                        <span>Comenzar</span>
                        <i class="ph-bold ph-arrow-right"></i>
                    </div>
                `;
                grid.appendChild(btn);
            });
        }

        function startMystery(mysteryKey) {
            currentMysteryKey = mysteryKey;
            stepsSequence = buildStepsForMystery(mysteryKey);
            currentStepIndex = 0;
            visualBeadIndex = 0;
            targetBeadIndex = 0;

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('completionModal').classList.add('hidden');
            document.getElementById('prayerScreen').classList.remove('hidden');
            document.getElementById('changeMysteryBtn').classList.remove('hidden');
            document.getElementById('changeMysteryBtn').classList.add('inline-flex');

            updatePrayerView(1);
            playBeadClickSound(540);
        }

        function showHomeScreen() {
            document.getElementById('prayerScreen').classList.add('hidden');
            document.getElementById('completionModal').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            document.getElementById('changeMysteryBtn').classList.add('hidden');
            document.getElementById('changeMysteryBtn').classList.remove('inline-flex');
        }

        function nextStep() {
            if (currentStepIndex < stepsSequence.length - 1) {
                currentStepIndex++;
                updatePrayerView(1);
                playBeadClickSound(620);
            } else {
                // Terminó los 5 misterios y el Ángelus -> mostrar frase aleatoria de los 30 Santos Canónicos
                playBeadClickSound(880);
                pickRandomSaintQuote();
                document.getElementById('completionModal').classList.remove('hidden');
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updatePrayerView(-1);
                playBeadClickSound(460);
            }
        }

        function restartRosary() {
            document.getElementById('completionModal').classList.add('hidden');
            currentStepIndex = 0;
            updatePrayerView(-1);
        }

        function pickRandomSaintQuote() {
            const randomIndex = Math.floor(Math.random() * CANONICAL_SAINT_QUOTES.length);
            const item = CANONICAL_SAINT_QUOTES[randomIndex];
            document.getElementById('saintQuoteText').textContent = `"${item.quote}"`;
            document.getElementById('saintAuthorName').textContent = `— ${item.saint}`;
        }

        /* =========================================================================
           9. MÚSICA AMBIENTAL MEDITATIVA Y SONIDO DE CUENTA DE MADERA (WEB AUDIO API)
           ========================================================================= */
        let audioCtx = null;
        let ambientPlaying = false;
        let ambientOscillators = [];

        function ensureAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sonido sutil y orgánico al deslizar una cuenta del rosario
        function playBeadClickSound(freq = 600) {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.75, audioCtx.currentTime + 0.09);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.19);
            } catch (e) {}
        }

        // Música de ambiente celestial (acorde cálido continuo)
        function toggleAmbientSound() {
            ensureAudio();
            const label = document.getElementById('ambientLabel');
            const btn = document.getElementById('ambientBtn');

            if (!ambientPlaying) {
                const chord = [261.63, 329.63, 392.00, 523.25]; // Do Mayor celestial
                ambientOscillators = chord.map(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.016, audioCtx.currentTime + 1.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    return { osc, gain };
                });

                ambientPlaying = true;
                label.textContent = 'Música Ambiente: On';
                btn.classList.add('border-amber-400/50', 'bg-amber-500/15');
            } else {
                ambientOscillators.forEach(node => {
                    try {
                        node.gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
                        setTimeout(() => node.osc.stop(), 450);
                    } catch (e) {}
                });
                ambientOscillators = [];
                ambientPlaying = false;
                label.textContent = 'Música Ambiente: Off';
                btn.classList.remove('border-amber-400/50', 'bg-amber-500/15');
            }
        }

        /* =========================================================================
           10. ATAJOS DE TECLADO E INICIALIZACIÓN
           ========================================================================= */
        window.addEventListener('keydown', (e) => {
            const isPraying = !document.getElementById('prayerScreen').classList.contains('hidden');
            const isModal = !document.getElementById('completionModal').classList.contains('hidden');
            if (!isPraying || isModal) return;

            if (e.code === 'ArrowRight' || e.code === 'Space') {
                e.preventDefault();
                nextStep();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevStep();
            }
        });

        window.onload = () => {
            renderHomeMysteryCards();
            startContinuousRosaryLoop();
        };
    </script>
</body>
</html>
